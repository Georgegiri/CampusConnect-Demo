name: Build CampusConnect Windows EXE

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore desktop demo
        shell: pwsh
        run: |
          $b64 = Get-Content desktop_demo.zip.b64 -Raw
          [IO.File]::WriteAllBytes("desktop_demo.zip", [Convert]::FromBase64String($b64))
          Expand-Archive desktop_demo.zip -DestinationPath .
      - name: Patch database location for Windows
        shell: pwsh
        run: |
          $path = "CampusConnect_Desktop_Demo\campusconnect.py"
          $content = Get-Content $path -Raw

          $imports = @'
import os
import sqlite3
from pathlib import Path
'@
          $content = $content.Replace("import sqlite3", $imports.Trim())

          $old = 'DB_FILE = "campusconnect.db"'
          $new = @'
DATA_DIR = Path(os.getenv("LOCALAPPDATA", str(Path.home()))) / "CampusConnect"
DATA_DIR.mkdir(parents=True, exist_ok=True)
DB_FILE = str(DATA_DIR / "campusconnect.db")
'@
          $content = $content.Replace($old, $new.Trim())
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        shell: pwsh
        run: |
          cd CampusConnect_Desktop_Demo
          pyinstaller --noconfirm --clean --onefile --windowed --name CampusConnect campusconnect.py
          Copy-Item dist\CampusConnect.exe ..\CampusConnect.exe
      - name: Smoke-check artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "CampusConnect.exe")) { throw "EXE not created" }
          Get-Item CampusConnect.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-Windows
          path: CampusConnect.exe
